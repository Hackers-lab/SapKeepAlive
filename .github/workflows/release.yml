name: Release SapKeepAlive

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Determine Release Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            TAG=$(cat version.txt 2>/dev/null || echo "v2.1.0")
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Compile Standalone Executable
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cmd.exe /c "C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe /target:winexe /optimize+ /win32icon:app.ico /out:SapKeepAlive_${TAG}.exe Program.cs"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          body: |
            ## SapKeepAlive - Multi-Session SAP Keep-Alive Tool

            ### Features in ${{ steps.vars.outputs.tag }}:
            - **Custom Application Logo & Icon**: High-resolution branded taskbar, window, and binary icon.
            - **Zero Dependencies**: Native standalone Windows executable (~33 KB).
            - **Window Stacking Fixed**: Form no longer forces itself on top of other applications.
            - **Automatic Session Discovery**: Detects and tracks all active SAP sessions (DP1, WP1, etc.) automatically without pressing ping.
            - **Daily Auto-Reset**: Daily countdown timer automatically resets each morning or on restart.
            - **Auto-Close / Logout Scheduler**: Gracefully closes/logs out all active SAP sessions at a designated time.
            - **In-App Direct Update Notifier**: Direct update notifications from GitHub repository.

            ### Download:
            Download **`SapKeepAlive_${{ steps.vars.outputs.tag }}.exe`** below and double-click to run!
          files: |
            SapKeepAlive_*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
