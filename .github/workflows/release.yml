name: Release SapKeepAlive

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Determine Release Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            TAG=$(cat version.txt 2>/dev/null || echo "v2.1.0")
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Compile Standalone Executables
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cmd.exe /c "C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe /target:winexe /optimize+ /out:SapKeepAlive.exe Program.cs"
          cmd.exe /c "C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe /target:winexe /optimize+ /out:SapKeepAlive_${TAG}.exe Program.cs"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          body: |
            ## SapKeepAlive - Multi-Session SAP Keep-Alive Tool

            ### Features:
            - **Zero Dependencies**: Lightweight standalone Windows executable (~27 KB).
            - **Background Non-Blocking Keep-Alive**: Prevents inactivity timeout without stealing keyboard focus or window activation.
            - **Automatic Session Discovery**: Detects and tracks all active SAP sessions (DP1, WP1, etc.) automatically.
            - **Daily Auto-Reset**: Daily countdown and auto-reset each morning/run.
            - **Auto-Close / Logout Scheduler**: Gracefully closes/logs out all active SAP sessions at a designated time.
            - **Configurable Settings**: Keystroke interval, expire hours, target key (Shift, F8, F13), auto-close time, auto-start with Windows.
            - **Update Notifier**: Direct GitHub release check.

            ### Downloads:
            - `SapKeepAlive_${{ steps.vars.outputs.tag }}.exe` (Versioned standalone executable)
            - `SapKeepAlive.exe` (Standard standalone executable)
          files: |
            SapKeepAlive.exe
            SapKeepAlive_*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
